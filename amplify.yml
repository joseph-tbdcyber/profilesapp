version: 1
backend:
  phases:
    build:
      commands:
        # npm ci cannot be used: @aws-cdk/toolkit-lib ships bundled deps that
        # npm 11.x omits from the lock file, so ci rejects a lock npm install just wrote.
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
